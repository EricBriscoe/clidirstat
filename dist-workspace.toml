# cargo-dist (https://opensource.axo.dev/cargo-dist/) release configuration.
# Run `dist plan` to dry-run, `dist generate` to refresh the GitHub Actions
# workflow, and push a `v*` tag to trigger a real release.

[workspace]
members = ["cargo:."]

[dist]
# Pinned for reproducible CI; bump with `dist update`.
cargo-dist-version = "0.31.0"
ci = "github"
installers = ["shell"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
# Only run a release planning pass on PRs; don't upload artifacts.
pr-run-mode = "plan"
# Skip publishing on tags whose name suggests a pre-release (e.g. `v0.3.0-rc1`).
publish-prereleases = false
