[package]
name = "clidirstat"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal disk usage analyzer with treemap visualization (WinDirStat for your CLI)"
license = "MIT"
repository = "https://github.com/EricBriscoe/clidirstat"
homepage = "https://github.com/EricBriscoe/clidirstat"
readme = "README.md"
keywords = ["disk-usage", "tui", "treemap", "windirstat", "du"]
categories = ["command-line-utilities", "filesystem"]
authors = ["Eric Briscoe <eric0briscoe@gmail.com>"]
include = [
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
  "README.md",
  "LICENSE",
  "rust-toolchain.toml",
]


[[bin]]
name = "clidirstat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dashmap = "6"
globset = "0.4"
humansize = "2"
libc = "0.2"
num_cpus = "1"
rayon = "1"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal-colorsaurus = "1"
unicode-width = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "scan"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
